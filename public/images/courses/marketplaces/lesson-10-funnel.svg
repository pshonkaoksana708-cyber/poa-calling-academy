<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="#F8F6F2"/><rect width="1600" height="160" fill="#17324D"/><text x="70" y="70" fill="#C8A45D" font-family="Arial" font-size="26" font-weight="700">УРОК 10 • АНАЛИТИКА И ВОРОНКА</text><text x="70" y="120" fill="#FFFDF8" font-family="Arial" font-size="40" font-weight="700">«Продажи упали» — это симптом. Ищем место поломки.</text><g font-family="Arial"><text x="70" y="225" fill="#17324D" font-size="27" font-weight="700">Сентябрь → Октябрь</text><g fill="#FFFDF8" stroke="#D9D3C8"><rect x="70" y="270" width="260" height="100" rx="22"/><rect x="380" y="270" width="260" height="100" rx="22"/><rect x="690" y="270" width="260" height="100" rx="22"/><rect x="1000" y="270" width="260" height="100" rx="22"/><rect x="1310" y="270" width="220" height="100" rx="22"/></g><g fill="#17324D" text-anchor="middle"><text x="200" y="310" font-size="19">Показы</text><text x="200" y="345" font-size="22" font-weight="700">500k → 500k</text><text x="510" y="310" font-size="19">Переходы</text><text x="510" y="345" font-size="22" font-weight="700">20k → 14k</text><text x="820" y="310" font-size="19">Корзина</text><text x="820" y="345" font-size="22" font-weight="700">4k → 2,8k</text><text x="1130" y="310" font-size="19">Заказы</text><text x="1130" y="345" font-size="22" font-weight="700">2k → 1,4k</text><text x="1420" y="310" font-size="19">Выкуп</text><text x="1420" y="345" font-size="22" font-weight="700">1,6k → 1,12k</text></g><rect x="70" y="430" width="1460" height="120" rx="25" fill="#17324D"/><text x="110" y="480" fill="#C8A45D" font-size="24" font-weight="700">ПЕРВЫЙ ДИАГНОЗ</text><text x="110" y="525" fill="#FFFDF8" font-size="22">Показы не изменились, а переходы упали. CTR: 4,0% → 2,8%. Сначала исследуем этап клика.</text><rect x="70" y="610" width="700" height="170" rx="25" fill="#FFFDF8" stroke="#D9D3C8"/><text x="110" y="655" fill="#17324D" font-size="23" font-weight="700">Пульт собственника</text><text x="110" y="700" fill="#17324D" font-size="20">KPI → сейчас → было → Δ → причина → действие</text><text x="110" y="742" fill="#17324D" font-size="20">+ журнал событий: цена, акция, фото, поставка, реклама</text><rect x="830" y="610" width="700" height="170" rx="25" fill="#FFFDF8" stroke="#C8A45D" stroke-width="2"/><text x="870" y="655" fill="#17324D" font-size="23" font-weight="700">Порядок диагностики</text><text x="870" y="700" fill="#17324D" font-size="20">1. Где отклонение?  2. Что изменилось?</text><text x="870" y="742" fill="#17324D" font-size="20">3. Какая гипотеза?  4. Что проверяем первым?</text><text x="70" y="845" fill="#C8A45D" font-size="22" font-weight="700">Не лечим весь магазин одной кнопкой «добавить рекламу».</text></g></svg>