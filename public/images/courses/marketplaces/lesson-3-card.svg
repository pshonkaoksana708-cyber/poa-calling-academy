<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="#F8F6F2"/><rect width="1600" height="160" fill="#17324D"/><text x="70" y="70" fill="#C8A45D" font-family="Arial" font-size="26" font-weight="700">УРОК 3 • КАРТОЧКА ТОВАРА</text><text x="70" y="120" fill="#FFFDF8" font-family="Arial" font-size="40" font-weight="700">Покупатель должен понять товар за несколько секунд</text><g font-family="Arial"><rect x="80" y="220" width="620" height="500" rx="28" fill="#FFFDF8" stroke="#D9D3C8"/><text x="120" y="275" fill="#A54848" font-size="26" font-weight="700">ДО ❌</text><rect x="120" y="315" width="210" height="230" rx="20" fill="#E9E5DE"/><text x="225" y="430" fill="#777" font-size="26" text-anchor="middle">товар далеко</text><text x="370" y="350" fill="#17324D" font-size="25" font-weight="700">КОФТА ЖЕНСКАЯ</text><text x="370" y="385" fill="#17324D" font-size="25" font-weight="700">МОДНАЯ КРАСИВАЯ</text><text x="370" y="440" fill="#17324D" font-size="22">2 490 ₽</text><text x="120" y="595" fill="#A54848" font-size="20">✕ перегруженное название</text><text x="120" y="630" fill="#A54848" font-size="20">✕ нет материала и посадки</text><text x="120" y="665" fill="#A54848" font-size="20">✕ слабое главное изображение</text><rect x="900" y="220" width="620" height="500" rx="28" fill="#FFFDF8" stroke="#C8A45D" stroke-width="3"/><text x="940" y="275" fill="#2B8A57" font-size="26" font-weight="700">ПОСЛЕ ✓</text><rect x="940" y="315" width="210" height="230" rx="20" fill="#EEF2F5"/><path d="M1000 360h90l30 50-35 20v100h-80V430l-35-20z" fill="#FFF" stroke="#17324D" stroke-width="3"/><text x="1190" y="350" fill="#17324D" font-size="25" font-weight="700">Футболка женская</text><text x="1190" y="385" fill="#17324D" font-size="22">хлопковая • свободный крой</text><text x="1190" y="440" fill="#17324D" font-size="22">⭐ 4,7 • 1 240 отзывов</text><text x="1190" y="485" fill="#17324D" font-size="28" font-weight="700">2 490 ₽</text><text x="940" y="595" fill="#2B8A57" font-size="20">✓ товар считывается сразу</text><text x="940" y="630" fill="#2B8A57" font-size="20">✓ понятны материал и посадка</text><text x="940" y="665" fill="#2B8A57" font-size="20">✓ карточка снимает вопросы</text><text x="80" y="790" fill="#17324D" font-size="27" font-weight="700">Галерея: 1 товар → 2 посадка → 3 материал → 4 размеры → 5 детали → 6 сценарий → 7 уход/комплектация</text><text x="80" y="840" fill="#C8A45D" font-size="23" font-weight="700">Каждый элемент карточки должен уменьшать неопределённость покупателя.</text></g></svg>