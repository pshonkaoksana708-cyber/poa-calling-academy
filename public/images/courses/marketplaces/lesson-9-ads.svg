<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="#F8F6F2"/><rect width="1600" height="160" fill="#17324D"/><text x="70" y="70" fill="#C8A45D" font-family="Arial" font-size="26" font-weight="700">УРОК 9 • РЕКЛАМА</text><text x="70" y="120" fill="#FFFDF8" font-family="Arial" font-size="40" font-weight="700">Реклама ускоряет систему — и хорошую, и плохую</text><g font-family="Arial"><rect x="70" y="220" width="500" height="500" rx="28" fill="#FFFDF8" stroke="#D9D3C8"/><text x="110" y="275" fill="#17324D" font-size="27" font-weight="700">До запуска проверяем</text><text x="110" y="340" fill="#2B8A57" font-size="21">✓ запас товара</text><text x="110" y="390" fill="#2B8A57" font-size="21">✓ карточку и главное фото</text><text x="110" y="440" fill="#2B8A57" font-size="21">✓ цену и предложение</text><text x="110" y="490" fill="#2B8A57" font-size="21">✓ семантику</text><text x="110" y="540" fill="#2B8A57" font-size="21">✓ юнит-экономику</text><text x="110" y="610" fill="#A54848" font-size="20">Нет запаса или экономика в минусе?</text><text x="110" y="650" fill="#A54848" font-size="20" font-weight="700">Не масштабируем.</text><rect x="620" y="220" width="910" height="500" rx="28" fill="#17324D"/><text x="660" y="275" fill="#C8A45D" font-size="27" font-weight="700">Учебная кампания</text><text x="680" y="345" fill="#FFFDF8" font-size="20">Показы</text><text x="1000" y="345" fill="#FFFDF8" font-size="26" font-weight="700">200 000</text><text x="680" y="400" fill="#FFFDF8" font-size="20">Клики</text><text x="1000" y="400" fill="#FFFDF8" font-size="26" font-weight="700">4 000</text><text x="680" y="455" fill="#FFFDF8" font-size="20">Заказы</text><text x="1000" y="455" fill="#FFFDF8" font-size="26" font-weight="700">200</text><text x="680" y="510" fill="#FFFDF8" font-size="20">Выручка</text><text x="1000" y="510" fill="#FFFDF8" font-size="26" font-weight="700">160 000 ₽</text><text x="680" y="565" fill="#FFFDF8" font-size="20">Расход</text><text x="1000" y="565" fill="#FFFDF8" font-size="26" font-weight="700">24 000 ₽</text><line x1="1120" y1="320" x2="1120" y2="610" stroke="#C8A45D"/><text x="1170" y="380" fill="#C8A45D" font-size="24" font-weight="700">CTR 2%</text><text x="1170" y="440" fill="#C8A45D" font-size="24" font-weight="700">CPC 6 ₽</text><text x="1170" y="500" fill="#C8A45D" font-size="24" font-weight="700">CR 5%</text><text x="1170" y="560" fill="#C8A45D" font-size="24" font-weight="700">ДРР 15%</text><text x="660" y="675" fill="#FFFDF8" font-size="20">Этого всё ещё недостаточно: сверяем с прибылью на SKU.</text><text x="70" y="805" fill="#17324D" font-size="24" font-weight="700">Гипотеза → бюджет → период → метрики → правило «оставить / изменить / остановить»</text><text x="70" y="850" fill="#C8A45D" font-size="21" font-weight="700">Не дёргаем настройки каждый день из-за одного плохого результата.</text></g></svg>