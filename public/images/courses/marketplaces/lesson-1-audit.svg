<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F8F6F2"/><rect x="0" y="0" width="1600" height="170" fill="#17324D"/><text x="70" y="75" fill="#C8A45D" font-family="Arial" font-size="26" font-weight="700">УРОК 1 • ПЕРВЫЙ РАБОЧИЙ ДЕНЬ</text><text x="70" y="125" fill="#FFFDF8" font-family="Arial" font-size="42" font-weight="700">Принимаем магазин и проводим экспресс-аудит</text><g font-family="Arial"><rect x="70" y="215" width="450" height="560" rx="28" fill="#FFFDF8" stroke="#D9D3C8"/><text x="105" y="270" fill="#17324D" font-size="28" font-weight="700">1. Что запросить</text><text x="105" y="325" fill="#17324D" font-size="22">✓ доступы Ozon / WB</text><text x="105" y="370" fill="#17324D" font-size="22">✓ список SKU и себестоимость</text><text x="105" y="415" fill="#17324D" font-size="22">✓ остатки и поставки</text><text x="105" y="460" fill="#17324D" font-size="22">✓ документы и продажи</text><text x="105" y="505" fill="#17324D" font-size="22">✓ реклама и возвраты</text><text x="105" y="550" fill="#17324D" font-size="22">✓ история изменений</text><rect x="105" y="610" width="380" height="120" rx="18" fill="#EEF2F5"/><text x="130" y="655" fill="#17324D" font-size="20" font-weight="700">Правило:</text><text x="130" y="692" fill="#17324D" font-size="19">не меняем то, чего</text><text x="130" y="720" fill="#17324D" font-size="19">ещё не поняли.</text><rect x="570" y="215" width="440" height="560" rx="28" fill="#FFFDF8" stroke="#D9D3C8"/><text x="605" y="270" fill="#17324D" font-size="28" font-weight="700">2. Светофор магазина</text><circle cx="630" cy="340" r="18" fill="#C73A3A"/><text x="670" y="348" fill="#17324D" font-size="21">хит заканчивается</text><circle cx="630" cy="395" r="18" fill="#C73A3A"/><text x="670" y="403" fill="#17324D" font-size="21">экономика отрицательная</text><circle cx="630" cy="470" r="18" fill="#D99B32"/><text x="670" y="478" fill="#17324D" font-size="21">слабый CTR</text><circle cx="630" cy="525" r="18" fill="#D99B32"/><text x="670" y="533" fill="#17324D" font-size="21">медленный запас</text><circle cx="630" cy="600" r="18" fill="#2B8A57"/><text x="670" y="608" fill="#17324D" font-size="21">работает стабильно</text><text x="605" y="690" fill="#C8A45D" font-size="23" font-weight="700">Сначала защищаем деньги.</text><rect x="1060" y="215" width="470" height="560" rx="28" fill="#17324D"/><text x="1095" y="270" fill="#C8A45D" font-size="28" font-weight="700">3. Пульт менеджера</text><text x="1095" y="330" fill="#FFFDF8" font-size="20">Продажи вчера</text><text x="1390" y="330" fill="#FFFDF8" font-size="26" font-weight="700">148 300 ₽</text><text x="1095" y="385" fill="#FFFDF8" font-size="20">Заказы</text><text x="1390" y="385" fill="#FFFDF8" font-size="26" font-weight="700">86</text><text x="1095" y="440" fill="#FFFDF8" font-size="20">Реклама</text><text x="1390" y="440" fill="#FFFDF8" font-size="26" font-weight="700">21 400 ₽</text><line x1="1095" y1="480" x2="1490" y2="480" stroke="#C8A45D"/><text x="1095" y="530" fill="#FFFDF8" font-size="20">🚨 A01 — запас на 3 дня</text><text x="1095" y="575" fill="#FFFDF8" font-size="20">🚨 A07 — экономика в минусе</text><text x="1095" y="620" fill="#FFFDF8" font-size="20">⚠ A03 — рейтинг падает</text><text x="1095" y="665" fill="#FFFDF8" font-size="20">⚠ A12 — запас на 187 дней</text><text x="1095" y="730" fill="#C8A45D" font-size="21" font-weight="700">Факт → диагноз → действие → метрика</text></g></svg>