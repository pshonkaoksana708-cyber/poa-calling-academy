<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="#F8F6F2"/><rect width="1600" height="160" fill="#17324D"/><text x="70" y="70" fill="#C8A45D" font-family="Arial" font-size="26" font-weight="700">УРОК 7 • ПОСТАВКА ОТ ПЛАНА ДО ПРИЁМКИ</text><text x="70" y="120" fill="#FFFDF8" font-family="Arial" font-size="40" font-weight="700">Поставка начинается не с коробки, а с расчёта</text><g font-family="Arial"><text x="70" y="225" fill="#17324D" font-size="28" font-weight="700">Расчёт потребности</text><rect x="70" y="260" width="1460" height="100" rx="24" fill="#FFFDF8" stroke="#C8A45D" stroke-width="2"/><text x="110" y="320" fill="#17324D" font-size="24">10 шт./день × (30 дней запаса + 7 дней до пополнения) − 80 шт. остатка =</text><text x="1370" y="320" fill="#17324D" font-size="34" font-weight="700" text-anchor="end">290 шт.</text><text x="70" y="430" fill="#17324D" font-size="28" font-weight="700">Контрольная цепочка</text><g fill="#FFFDF8" stroke="#D9D3C8"><rect x="70" y="470" width="190" height="100" rx="20"/><rect x="300" y="470" width="190" height="100" rx="20"/><rect x="530" y="470" width="190" height="100" rx="20"/><rect x="760" y="470" width="190" height="100" rx="20"/><rect x="990" y="470" width="190" height="100" rx="20"/><rect x="1220" y="470" width="310" height="100" rx="20"/></g><g fill="#17324D" font-size="19" text-anchor="middle"><text x="165" y="530">План</text><text x="395" y="530">Создание</text><text x="625" y="530">Маркировка</text><text x="855" y="530">Упаковка</text><text x="1085" y="530">Передача</text><text x="1375" y="515">Приёмка</text><text x="1375" y="542">и расхождения</text></g><g fill="#C8A45D" font-size="30"><text x="270" y="535">→</text><text x="500" y="535">→</text><text x="730" y="535">→</text><text x="960" y="535">→</text><text x="1190" y="535">→</text></g><rect x="70" y="630" width="1460" height="150" rx="25" fill="#17324D"/><text x="110" y="680" fill="#C8A45D" font-size="23" font-weight="700">ТРИ УРОВНЯ КОНТРОЛЯ</text><text x="110" y="730" fill="#FFFDF8" font-size="21">Единица: товар и код • Короб/палета: состав и маркировка • Поставка: количество, направление, статус</text><text x="110" y="765" fill="#FFFDF8" font-size="20">После передачи работа не закончена: сверяем принятое количество, расхождения и доступный остаток.</text></g></svg>