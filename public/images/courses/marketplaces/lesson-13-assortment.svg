<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="#F8F6F2"/><rect width="1600" height="160" fill="#17324D"/><text x="70" y="70" fill="#C8A45D" font-family="Arial" font-size="26" font-weight="700">УРОК 13 • АССОРТИМЕНТ И КОНКУРЕНТЫ</text><text x="70" y="120" fill="#FFFDF8" font-family="Arial" font-size="40" font-weight="700">Не копируем лидера — ищем свободную возможность</text><g font-family="Arial"><rect x="70" y="220" width="700" height="520" rx="28" fill="#FFFDF8" stroke="#D9D3C8"/><text x="110" y="275" fill="#17324D" font-size="27" font-weight="700">Карта конкурентов</text><text x="110" y="335" fill="#17324D" font-size="20">Цена • рейтинг • отзывы • контент</text><text x="110" y="375" fill="#17324D" font-size="20">варианты • доставка • частые жалобы</text><rect x="120" y="440" width="560" height="200" rx="20" fill="#EEF2F5"/><text x="160" y="485" fill="#17324D" font-size="20">Конкурент A: сильные фото, мало цветов</text><text x="160" y="530" fill="#17324D" font-size="20">Конкурент B: низкая цена, жалобы на упаковку</text><text x="160" y="575" fill="#17324D" font-size="20">Конкурент C: высокий рейтинг, долгая доставка</text><text x="160" y="620" fill="#C8A45D" font-size="20" font-weight="700">Ищем не копию, а точку отличия.</text><rect x="830" y="220" width="700" height="520" rx="28" fill="#17324D"/><text x="870" y="275" fill="#C8A45D" font-size="27" font-weight="700">Матрица решений</text><line x1="930" y1="650" x2="1450" y2="650" stroke="#FFFDF8"/><line x1="930" y1="350" x2="930" y2="650" stroke="#FFFDF8"/><text x="1080" y="690" fill="#FFFDF8" font-size="18">низкая маржа</text><text x="1330" y="690" fill="#FFFDF8" font-size="18">высокая маржа</text><text x="855" y="390" fill="#FFFDF8" font-size="18" transform="rotate(-90 855 390)">высокий спрос</text><text x="855" y="625" fill="#FFFDF8" font-size="18" transform="rotate(-90 855 625)">низкий спрос</text><circle cx="1050" cy="410" r="45" fill="#C8A45D"/><text x="1050" y="418" fill="#17324D" font-size="20" font-weight="700" text-anchor="middle">ХИТ</text><circle cx="1320" cy="410" r="45" fill="#FFFDF8"/><text x="1320" y="418" fill="#17324D" font-size="18" font-weight="700" text-anchor="middle">РОСТ</text><circle cx="1080" cy="585" r="45" fill="#A54848"/><text x="1080" y="593" fill="#FFFDF8" font-size="18" font-weight="700" text-anchor="middle">СТОП?</text><circle cx="1350" cy="565" r="45" fill="#FFFDF8"/><text x="1350" y="573" fill="#17324D" font-size="18" font-weight="700" text-anchor="middle">ТЕСТ</text></g></svg>