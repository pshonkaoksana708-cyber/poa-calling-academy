<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="#F8F6F2"/><rect width="1600" height="160" fill="#17324D"/><text x="70" y="70" fill="#C8A45D" font-family="Arial" font-size="26" font-weight="700">УРОК 11 • ОТЗЫВЫ И ВОЗВРАТЫ</text><text x="70" y="120" fill="#FFFDF8" font-family="Arial" font-size="40" font-weight="700">Негатив — не спор. Это данные о проблеме.</text><g font-family="Arial"><rect x="70" y="220" width="650" height="520" rx="28" fill="#FFFDF8" stroke="#D9D3C8"/><text x="110" y="275" fill="#17324D" font-size="27" font-weight="700">50 негативных отзывов</text><text x="110" y="340" fill="#17324D" font-size="21">Размер / посадка</text><rect x="330" y="318" width="270" height="28" rx="14" fill="#C8A45D"/><text x="620" y="340" fill="#17324D" font-size="21">31%</text><text x="110" y="400" fill="#17324D" font-size="21">Материал / качество</text><rect x="330" y="378" width="200" height="28" rx="14" fill="#C8A45D"/><text x="550" y="400" fill="#17324D" font-size="21">23%</text><text x="110" y="460" fill="#17324D" font-size="21">Упаковка</text><rect x="330" y="438" width="150" height="28" rx="14" fill="#C8A45D"/><text x="500" y="460" fill="#17324D" font-size="21">17%</text><text x="110" y="520" fill="#17324D" font-size="21">Цвет / ожидание</text><rect x="330" y="498" width="105" height="28" rx="14" fill="#C8A45D"/><text x="455" y="520" fill="#17324D" font-size="21">12%</text><text x="110" y="580" fill="#17324D" font-size="21">Комплектность</text><rect x="330" y="558" width="80" height="28" rx="14" fill="#C8A45D"/><text x="430" y="580" fill="#17324D" font-size="21">9%</text><text x="110" y="660" fill="#A54848" font-size="20">Повторяется → это уже не «частное мнение».</text><rect x="800" y="220" width="730" height="520" rx="28" fill="#17324D"/><text x="840" y="275" fill="#C8A45D" font-size="27" font-weight="700">Диагноз → действие</text><text x="840" y="340" fill="#FFFDF8" font-size="21">Размер → замеры + таблица + фото посадки</text><text x="840" y="400" fill="#FFFDF8" font-size="21">Материал → карточка или сам товар?</text><text x="840" y="460" fill="#FFFDF8" font-size="21">Упаковка → проверить логистическую цепочку</text><text x="840" y="520" fill="#FFFDF8" font-size="21">Цвет → ожидание от фото vs реальность</text><text x="840" y="580" fill="#FFFDF8" font-size="21">Комплектность → сборка / описание / контроль</text><line x1="840" y1="625" x2="1490" y2="625" stroke="#C8A45D"/><text x="840" y="680" fill="#C8A45D" font-size="21" font-weight="700">Отзыв → категория причины → частота → решение → метрика</text></g></svg>