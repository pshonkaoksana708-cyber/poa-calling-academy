<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="#F8F6F2"/><rect width="1600" height="160" fill="#17324D"/><text x="70" y="70" fill="#C8A45D" font-family="Arial" font-size="26" font-weight="700">УРОК 4 • SEO И КОНТЕНТ</text><text x="70" y="120" fill="#FFFDF8" font-family="Arial" font-size="40" font-weight="700">Не просто показы — правильный покупатель</text><g font-family="Arial"><text x="80" y="225" fill="#17324D" font-size="28" font-weight="700">Воронка диагностики</text><g fill="#FFFDF8" stroke="#C8A45D" stroke-width="2"><rect x="80" y="270" width="240" height="95" rx="22"/><rect x="390" y="270" width="240" height="95" rx="22"/><rect x="700" y="270" width="240" height="95" rx="22"/><rect x="1010" y="270" width="240" height="95" rx="22"/><rect x="1320" y="270" width="200" height="95" rx="22"/></g><g fill="#17324D" font-size="21" text-anchor="middle"><text x="200" y="325">100 000 показов</text><text x="510" y="325">2 400 переходов</text><text x="820" y="325">корзина</text><text x="1130" y="325">заказ</text><text x="1420" y="325">выкуп</text></g><g fill="#C8A45D" font-size="34"><text x="340" y="330">→</text><text x="650" y="330">→</text><text x="960" y="330">→</text><text x="1270" y="330">→</text></g><rect x="80" y="430" width="690" height="350" rx="28" fill="#FFFDF8" stroke="#D9D3C8"/><text x="120" y="485" fill="#17324D" font-size="27" font-weight="700">Семантика термокружки 450 мл</text><text x="120" y="545" fill="#2B8A57" font-size="21">● релевантно: «термокружка 450 мл»</text><text x="120" y="590" fill="#2B8A57" font-size="21">● релевантно: «термокружка»</text><text x="120" y="635" fill="#D99B32" font-size="21">● проверить: «кружка для кофе»</text><text x="120" y="680" fill="#A54848" font-size="21">● убрать: «кружка стеклянная»</text><text x="120" y="735" fill="#17324D" font-size="20" font-weight="700">Релевантность важнее количества ключей.</text><rect x="830" y="430" width="690" height="350" rx="28" fill="#17324D"/><text x="870" y="485" fill="#C8A45D" font-size="27" font-weight="700">Если метрика падает — где искать?</text><text x="870" y="545" fill="#FFFDF8" font-size="20">Мало показов → спрос / релевантность</text><text x="870" y="590" fill="#FFFDF8" font-size="20">Показы есть, кликов мало → фото / цена / рейтинг</text><text x="870" y="635" fill="#FFFDF8" font-size="20">Клики есть, корзин мало → карточка / доверие</text><text x="870" y="680" fill="#FFFDF8" font-size="20">Заказы есть, выкуп низкий → товар / ожидания</text><text x="870" y="735" fill="#C8A45D" font-size="21" font-weight="700">Не оптимизируем одну метрику в отрыве от воронки.</text></g></svg>