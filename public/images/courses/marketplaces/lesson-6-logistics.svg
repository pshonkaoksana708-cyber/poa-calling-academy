<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="#F8F6F2"/><rect width="1600" height="160" fill="#17324D"/><text x="70" y="70" fill="#C8A45D" font-family="Arial" font-size="26" font-weight="700">УРОК 6 • ЛОГИСТИЧЕСКАЯ СХЕМА</text><text x="70" y="120" fill="#FFFDF8" font-family="Arial" font-size="40" font-weight="700">Где хранить товар и кто будет собирать заказ?</text><g font-family="Arial"><rect x="70" y="220" width="700" height="500" rx="30" fill="#FFFDF8" stroke="#D9D3C8"/><text x="110" y="275" fill="#17324D" font-size="28" font-weight="700">Склад маркетплейса</text><text x="110" y="325" fill="#C8A45D" font-size="20" font-weight="700">WB: FBW • Ozon: FBO</text><text x="110" y="390" fill="#17324D" font-size="21">Продавец → поставка → склад площадки</text><text x="110" y="430" fill="#17324D" font-size="21">→ хранение → заказ → сборка → доставка</text><text x="110" y="500" fill="#2B8A57" font-size="20">✓ подходит стабильным ходовым SKU</text><text x="110" y="545" fill="#2B8A57" font-size="20">✓ меньше ежедневной сборки у продавца</text><text x="110" y="610" fill="#A54848" font-size="20">⚠ риск избыточного запаса</text><text x="110" y="650" fill="#A54848" font-size="20">⚠ нужна точность планирования поставок</text><rect x="830" y="220" width="700" height="500" rx="30" fill="#17324D"/><text x="870" y="275" fill="#C8A45D" font-size="28" font-weight="700">Склад продавца</text><text x="870" y="325" fill="#FFFDF8" font-size="20" font-weight="700">FBS</text><text x="870" y="390" fill="#FFFDF8" font-size="21">Заказ → проверка остатка → сборка</text><text x="870" y="430" fill="#FFFDF8" font-size="21">→ маркировка → упаковка → передача</text><text x="870" y="500" fill="#FFFDF8" font-size="20">✓ удобно тестировать новинки</text><text x="870" y="545" fill="#FFFDF8" font-size="20">✓ контроль физического запаса</text><text x="870" y="610" fill="#C8A45D" font-size="20">⚠ нужна ежедневная дисциплина</text><text x="870" y="650" fill="#C8A45D" font-size="20">⚠ цифровой остаток = физический остаток</text><text x="70" y="795" fill="#17324D" font-size="25" font-weight="700">Гибрид: хиты → склад площадки • новинки и медленные SKU → тест со склада продавца</text><text x="70" y="845" fill="#C8A45D" font-size="22" font-weight="700">Схема — не «навсегда». Пересматриваем её по спросу, экономике и операционным возможностям.</text></g></svg>