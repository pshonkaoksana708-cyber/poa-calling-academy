<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="#F8F6F2"/><rect width="1600" height="160" fill="#17324D"/><text x="70" y="70" fill="#C8A45D" font-family="Arial" font-size="26" font-weight="700">УРОК 14 • СИСТЕМА РАБОТЫ</text><text x="70" y="120" fill="#FFFDF8" font-family="Arial" font-size="40" font-weight="700">Что менеджер делает каждый день, неделю и месяц</text><g font-family="Arial"><rect x="70" y="220" width="450" height="520" rx="28" fill="#FFFDF8" stroke="#D9D3C8"/><text x="110" y="275" fill="#17324D" font-size="26" font-weight="700">Каждый день</text><text x="110" y="335" fill="#17324D" font-size="20">🚨 уведомления и блокировки</text><text x="110" y="380" fill="#17324D" font-size="20">📦 критичные остатки</text><text x="110" y="425" fill="#17324D" font-size="20">🛒 заказы и сбои</text><text x="110" y="470" fill="#17324D" font-size="20">📣 рекламные аномалии</text><text x="110" y="515" fill="#17324D" font-size="20">⭐ отзывы и вопросы</text><text x="110" y="560" fill="#17324D" font-size="20">💰 цена и акции</text><rect x="575" y="220" width="450" height="520" rx="28" fill="#17324D"/><text x="615" y="275" fill="#C8A45D" font-size="26" font-weight="700">Каждую неделю</text><text x="615" y="335" fill="#FFFDF8" font-size="20">📊 воронка и экономика</text><text x="615" y="380" fill="#FFFDF8" font-size="20">🚚 поставки</text><text x="615" y="425" fill="#FFFDF8" font-size="20">🧊 медленные запасы</text><text x="615" y="470" fill="#FFFDF8" font-size="20">🧪 гипотезы</text><text x="615" y="515" fill="#FFFDF8" font-size="20">⚔ конкуренты</text><text x="615" y="560" fill="#FFFDF8" font-size="20">💬 отчёт собственнику</text><rect x="1080" y="220" width="450" height="520" rx="28" fill="#FFFDF8" stroke="#C8A45D" stroke-width="2"/><text x="1120" y="275" fill="#17324D" font-size="26" font-weight="700">Каждый месяц</text><text x="1120" y="335" fill="#17324D" font-size="20">🎯 прибыльность SKU</text><text x="1120" y="380" fill="#17324D" font-size="20">📈 ассортимент и рост</text><text x="1120" y="425" fill="#17324D" font-size="20">💵 капитал в запасах</text><text x="1120" y="470" fill="#17324D" font-size="20">📣 рекламная стратегия</text><text x="1120" y="515" fill="#17324D" font-size="20">🗺 план следующего месяца</text><text x="1120" y="580" fill="#C8A45D" font-size="20" font-weight="700">Приоритет: деньги → клиент → рост</text><text x="70" y="820" fill="#17324D" font-size="23" font-weight="700">Отчёт собственнику: ФАКТ → ПОЧЕМУ ВАЖНО → ЧТО ПРЕДЛАГАЮ → КАКОЕ РЕШЕНИЕ НУЖНО</text></g></svg>