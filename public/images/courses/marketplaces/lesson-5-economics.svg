<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="#F8F6F2"/><rect width="1600" height="160" fill="#17324D"/><text x="70" y="70" fill="#C8A45D" font-family="Arial" font-size="26" font-weight="700">УРОК 5 • ЦЕНА И ЮНИТ-ЭКОНОМИКА</text><text x="70" y="120" fill="#FFFDF8" font-family="Arial" font-size="40" font-weight="700">Выручка ещё не означает, что бизнес заработал</text><g font-family="Arial"><rect x="70" y="220" width="700" height="560" rx="30" fill="#FFFDF8" stroke="#D9D3C8"/><text x="110" y="275" fill="#17324D" font-size="28" font-weight="700">Разбираем одну продажу: 3 000 ₽</text><g font-size="21" fill="#17324D"><text x="120" y="340">Себестоимость</text><text x="650" y="340" text-anchor="end">−900 ₽</text><text x="120" y="390">Комиссия</text><text x="650" y="390" text-anchor="end">−600 ₽</text><text x="120" y="440">Логистика</text><text x="650" y="440" text-anchor="end">−300 ₽</text><text x="120" y="490">Реклама</text><text x="650" y="490" text-anchor="end">−300 ₽</text><text x="120" y="540">Упаковка и прочее</text><text x="650" y="540" text-anchor="end">−80 ₽</text><text x="120" y="590">Резерв возвратов</text><text x="650" y="590" text-anchor="end">−120 ₽</text><text x="120" y="640">Налог</text><text x="650" y="640" text-anchor="end">−180 ₽</text></g><rect x="110" y="680" width="550" height="65" rx="20" fill="#17324D"/><text x="140" y="722" fill="#FFFDF8" font-size="24" font-weight="700">Осталось</text><text x="620" y="722" fill="#C8A45D" font-size="30" font-weight="700" text-anchor="end">520 ₽</text><rect x="830" y="220" width="700" height="560" rx="30" fill="#17324D"/><text x="870" y="275" fill="#C8A45D" font-size="28" font-weight="700">Акция: продажи выросли. А прибыль?</text><text x="890" y="355" fill="#FFFDF8" font-size="22">ДО АКЦИИ</text><text x="890" y="400" fill="#FFFDF8" font-size="22">100 продаж × 400 ₽ =</text><text x="1370" y="400" fill="#C8A45D" font-size="30" font-weight="700">40 000 ₽</text><line x1="870" y1="445" x2="1490" y2="445" stroke="#C8A45D"/><text x="890" y="510" fill="#FFFDF8" font-size="22">ВО ВРЕМЯ АКЦИИ</text><text x="890" y="555" fill="#FFFDF8" font-size="22">150 продаж × 120 ₽ =</text><text x="1370" y="555" fill="#C8A45D" font-size="30" font-weight="700">18 000 ₽</text><text x="890" y="630" fill="#FFFDF8" font-size="22">Продажи: +50%</text><text x="890" y="675" fill="#FFFDF8" font-size="22">Финансовый результат: ↓</text><text x="890" y="730" fill="#C8A45D" font-size="21" font-weight="700">Перед скидкой сначала пересчитываем экономику.</text></g><text x="70" y="845" fill="#17324D" font-family="Arial" font-size="24" font-weight="700">Решение менеджера = цена + расходы + реклама + возвраты + налог + сценарий спроса.</text></svg>