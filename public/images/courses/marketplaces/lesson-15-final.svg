<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="#F8F6F2"/><rect width="1600" height="160" fill="#17324D"/><text x="70" y="70" fill="#C8A45D" font-family="Arial" font-size="26" font-weight="700">УРОК 15 • ИТОГОВЫЙ ПРОЕКТ</text><text x="70" y="120" fill="#FFFDF8" font-family="Arial" font-size="40" font-weight="700">30 дней менеджера: от аудита к управлению магазином</text><g font-family="Arial"><g fill="#FFFDF8" stroke="#D9D3C8"><rect x="70" y="230" width="330" height="230" rx="26"/><rect x="440" y="230" width="330" height="230" rx="26"/><rect x="810" y="230" width="330" height="230" rx="26"/><rect x="1180" y="230" width="350" height="230" rx="26"/></g><text x="105" y="285" fill="#C8A45D" font-size="24" font-weight="700">ДНИ 1–3</text><text x="105" y="330" fill="#17324D" font-size="20">Приёмка и аудит</text><text x="105" y="370" fill="#17324D" font-size="19">красные зоны</text><text x="105" y="405" fill="#17324D" font-size="19">точка А</text><text x="475" y="285" fill="#C8A45D" font-size="24" font-weight="700">ДНИ 4–7</text><text x="475" y="330" fill="#17324D" font-size="20">Экономика и запас</text><text x="475" y="370" fill="#17324D" font-size="19">воронка и реклама</text><text x="475" y="405" fill="#17324D" font-size="19">план поставок</text><text x="845" y="285" fill="#C8A45D" font-size="24" font-weight="700">НЕДЕЛИ 2–3</text><text x="845" y="330" fill="#17324D" font-size="20">Гипотезы</text><text x="845" y="370" fill="#17324D" font-size="19">изменения</text><text x="845" y="405" fill="#17324D" font-size="19">измерение</text><text x="1215" y="285" fill="#C8A45D" font-size="24" font-weight="700">НЕДЕЛЯ 4</text><text x="1215" y="330" fill="#17324D" font-size="20">Результаты</text><text x="1215" y="370" fill="#17324D" font-size="19">отчёт собственнику</text><text x="1215" y="405" fill="#17324D" font-size="19">план роста</text><rect x="70" y="540" width="1460" height="210" rx="28" fill="#17324D"/><text x="110" y="595" fill="#C8A45D" font-size="25" font-weight="700">ФИНАЛЬНЫЙ ЦИКЛ СПЕЦИАЛИСТА</text><text x="110" y="660" fill="#FFFDF8" font-size="30" font-weight="700">ДАННЫЕ → ДИАГНОЗ → ГИПОТЕЗА → ДЕЙСТВИЕ → ИЗМЕРЕНИЕ → РЕШЕНИЕ</text><text x="110" y="710" fill="#FFFDF8" font-size="20">Не «делать всё». Управлять системой и объяснять качество своих решений.</text><text x="70" y="835" fill="#17324D" font-size="23" font-weight="700">Защита: документы • карточка • SEO • экономика • запас • поставка • реклама • возвраты • Excel • отчёт собственнику</text></g></svg>