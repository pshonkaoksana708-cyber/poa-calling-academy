<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="#F8F6F2"/><rect width="1600" height="160" fill="#17324D"/><text x="70" y="70" fill="#C8A45D" font-family="Arial" font-size="26" font-weight="700">УРОК 8 • ОСТАТКИ И ОБОРАЧИВАЕМОСТЬ</text><text x="70" y="120" fill="#FFFDF8" font-family="Arial" font-size="40" font-weight="700">Дефицит теряет продажи. Избыток замораживает деньги.</text><g font-family="Arial"><rect x="70" y="220" width="700" height="520" rx="28" fill="#FFFDF8" stroke="#D9D3C8"/><text x="110" y="275" fill="#17324D" font-size="27" font-weight="700">Запас 240 шт. • продажи 12 шт./день</text><line x1="130" y1="650" x2="690" y2="650" stroke="#17324D" stroke-width="2"/><line x1="130" y1="340" x2="130" y2="650" stroke="#17324D" stroke-width="2"/><polyline points="150,360 250,410 350,460 450,510 550,560 650,630" fill="none" stroke="#C8A45D" stroke-width="8"/><g fill="#17324D" font-size="18"><text x="140" y="690">0</text><text x="240" y="690">4</text><text x="340" y="690">8</text><text x="435" y="690">12</text><text x="535" y="690">16</text><text x="635" y="690">20 дней</text></g><text x="110" y="320" fill="#17324D" font-size="20">Дни запаса = остаток / средние продажи в день</text><rect x="830" y="220" width="700" height="520" rx="28" fill="#17324D"/><text x="870" y="275" fill="#C8A45D" font-size="27" font-weight="700">Точка заказа</text><text x="870" y="340" fill="#FFFDF8" font-size="22">(срок пополнения + страховой запас)</text><text x="870" y="380" fill="#FFFDF8" font-size="22">× продажи в день</text><text x="870" y="445" fill="#FFFDF8" font-size="28" font-weight="700">(8 + 5) × 12 = 156 шт.</text><line x1="870" y1="490" x2="1490" y2="490" stroke="#C8A45D"/><text x="870" y="545" fill="#FFFDF8" font-size="21">🚨 OOS: товар закончился — теряем продажи</text><text x="870" y="590" fill="#FFFDF8" font-size="21">⚠ 900 шт. / 2 в день = 450 дней запаса</text><text x="870" y="635" fill="#FFFDF8" font-size="21">💰 900 × 800 ₽ = 720 000 ₽ в товаре</text><text x="870" y="695" fill="#C8A45D" font-size="21" font-weight="700">Цель — не максимум товара, а управляемый запас.</text><text x="70" y="815" fill="#17324D" font-size="23" font-weight="700">ABC: вклад в результат • XYZ: стабильность спроса → AX прогнозируем точнее, AZ держим осторожнее, CZ не закупаем автоматически.</text></g></svg>