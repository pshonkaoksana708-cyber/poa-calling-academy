<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="#F8F6F2"/><rect width="1600" height="160" fill="#17324D"/><text x="70" y="70" fill="#C8A45D" font-family="Arial" font-size="26" font-weight="700">УРОК 2 • ДОКУМЕНТЫ И МАРКИРОВКА</text><text x="70" y="120" fill="#FFFDF8" font-family="Arial" font-size="40" font-weight="700">Можно ли вообще продавать этот товар?</text><g font-family="Arial"><text x="90" y="225" fill="#17324D" font-size="28" font-weight="700">Путь проверки товара</text><g fill="#FFFDF8" stroke="#C8A45D" stroke-width="2"><rect x="70" y="270" width="210" height="95" rx="20"/><rect x="330" y="270" width="210" height="95" rx="20"/><rect x="590" y="270" width="210" height="95" rx="20"/><rect x="850" y="270" width="210" height="95" rx="20"/><rect x="1110" y="270" width="210" height="95" rx="20"/><rect x="1370" y="270" width="160" height="95" rx="20"/></g><g fill="#17324D" font-size="20" text-anchor="middle"><text x="175" y="325">Товар</text><text x="435" y="315">Категория</text><text x="435" y="342">и состав</text><text x="695" y="325">ТН ВЭД</text><text x="955" y="315">Документ</text><text x="955" y="342">соответствия</text><text x="1215" y="315">Маркировка</text><text x="1215" y="342">и GTIN</text><text x="1450" y="325">READY?</text></g><g fill="#C8A45D" font-size="34"><text x="292" y="330">→</text><text x="552" y="330">→</text><text x="812" y="330">→</text><text x="1072" y="330">→</text><text x="1332" y="330">→</text></g><rect x="70" y="430" width="700" height="360" rx="26" fill="#FFFDF8" stroke="#D9D3C8"/><text x="105" y="485" fill="#17324D" font-size="28" font-weight="700">Паспорт SKU</text><text x="105" y="535" fill="#17324D" font-size="20">Артикул • бренд • производитель • страна</text><text x="105" y="575" fill="#17324D" font-size="20">Категория • состав • размер • ТН ВЭД</text><text x="105" y="615" fill="#17324D" font-size="20">Маркировка • GTIN • баркод</text><text x="105" y="655" fill="#17324D" font-size="20">Документ • срок • себестоимость</text><text x="105" y="695" fill="#17324D" font-size="20">Вес • габариты упаковки</text><rect x="105" y="725" width="210" height="42" rx="18" fill="#E7F3EA"/><text x="125" y="753" fill="#2B8A57" font-size="18" font-weight="700">● READY</text><rect x="850" y="430" width="680" height="360" rx="26" fill="#17324D"/><text x="890" y="485" fill="#C8A45D" font-size="28" font-weight="700">Не путать</text><text x="890" y="545" fill="#FFFDF8" font-size="22">GTIN → идентификатор товарной позиции</text><text x="890" y="595" fill="#FFFDF8" font-size="22">Data Matrix / КИЗ → уникальная единица</text><text x="890" y="645" fill="#FFFDF8" font-size="22">Баркод → операционная идентификация</text><line x1="890" y1="685" x2="1480" y2="685" stroke="#C8A45D"/><text x="890" y="730" fill="#FFFDF8" font-size="20">🚨 Не копируем код конкурента.</text><text x="890" y="765" fill="#FFFDF8" font-size="20">При сомнении: NEEDS CHECK, а не догадка.</text></g></svg>