name: Import approved content-manager course
on:
  push:
    paths:
      - 'course-import/content-manager-ai.docx'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install python-docx
      - run: python scripts/import_content_manager.py
      - name: Commit full course
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/professions/content-manager-ai/index.ts data/professions/index.ts
          git diff --cached --quiet || (git commit -m "Publish complete 20-lesson content manager course" && git push)
